allowBuilds:
  '@google/genai': true
  esbuild: true
  keytar: true
  koffi: true
  protobufjs: true

# Intentionally admit this exact Pi release before the minimum-age gate: its
# extension-message ordering repair is required by Remote Pi's async events.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.4'
  - '@earendil-works/pi-ai@0.84.4'
  - '@earendil-works/pi-client@0.84.4'
  - '@earendil-works/pi-coding-agent@0.84.4'
  - '@earendil-works/pi-protocol@0.84.4'
  - '@earendil-works/pi-telemetry@0.84.4'
  - '@earendil-works/pi-tui@0.84.4'

# Keep transitive packages above known vulnerable ranges until upstreams
# release dependency updates that naturally resolve these versions.
overrides:
  '@hono/node-server': ^1.19.15
  brace-expansion: ^5.0.9
  esbuild: ^0.28.1
  fast-uri: ^3.1.5
  hono: ^4.12.34
  ip-address: ^10.3.1
  nanoid: ^3.3.18
  postcss: ^8.5.23
  protobufjs: ^7.6.5
  vite: ^8.0.16
  ws: ^8.21.3
