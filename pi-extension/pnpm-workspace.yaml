allowBuilds:
  '@google/genai': true
  esbuild: true
  keytar: true
  koffi: true
  protobufjs: true

# Intentionally admit the exact Pi 1.4.0 release before the minimum-age gate.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.4.0'
  - '@earendil-works/pi-ai@1.4.0'
  - '@earendil-works/pi-client@1.4.0'
  - '@earendil-works/pi-coding-agent@1.4.0'
  - '@earendil-works/pi-protocol@1.4.0'
  - '@earendil-works/pi-telemetry@1.4.0'
  - '@earendil-works/pi-tui@1.4.0'

# Keep transitive packages above known vulnerable ranges until upstreams
# release dependency updates that naturally resolve these versions.
overrides:
  '@hono/node-server': ^1.19.15
  brace-expansion: ^5.0.9
  esbuild: ^0.28.1
  fast-uri: ^3.1.5
  hono: ^4.12.34
  ip-address: ^10.3.1
  nanoid: ^3.3.18
  postcss: ^8.5.23
  protobufjs: ^7.6.5
  qs: ^6.16.0
  vite: ^8.0.16
  ws: ^8.21.3
